[project]
name = "popseq"
version = "0.1.0"
description = "A shared, regenerable catalog of fungal population sequencing data"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.84",
    "requests>=2.32",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
# Kept optional on purpose. PLAN.md section 2.1 says DuckDB is a derived index,
# not the source of truth, and benchmark 7.5 decides whether it earns its place.
duckdb = ["duckdb>=1.1"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.uv]
package = false
